<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classical Latin Study</title>
  <!-- iOS web app / home-screen bookmark icon -->
  <link rel="apple-touch-icon" href="logo.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Latin Study">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>&#x2756; Classical Latin Study</h1>
      <nav id="main-nav">
        <button class="nav-btn active" data-section="verbs">Verbs</button>
        <button class="nav-btn" data-section="nouns">Nouns</button>
        <button class="nav-btn" data-section="adjectives">Adjectives</button>
        <button class="nav-btn" data-section="vocabulary">Vocabulary</button>
        <button class="nav-btn" data-section="sentences">Sentences</button>
        <button class="nav-btn" data-section="quiz">Quiz</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- ── VERBS ── -->
    <section id="verbs" class="section active">
      <h2>Verb Conjugations</h2>
      <div class="controls">
        <label>
          Conjugation
          <select id="verb-conj-select">
            <option value="first">1st Conjugation (amō, amāre)</option>
            <option value="second">2nd Conjugation (moneō, monēre)</option>
            <option value="third">3rd Conjugation (dūcō, dūcere)</option>
            <option value="thirdio">3rd-iō Conjugation (capiō, capere)</option>
            <option value="fourth">4th Conjugation (audiō, audīre)</option>
            <option value="esse">Irregular: esse (sum)</option>
            <option value="ire">Irregular: īre (eō)</option>
            <option value="ferre">Irregular: ferre (ferō)</option>
            <option value="posse">Irregular: posse (possum)</option>
          </select>
        </label>
        <label>
          Mood / Category
          <select id="verb-mood-select">
            <option value="indicative">Indicative</option>
            <option value="subjunctive">Subjunctive</option>
            <option value="nonfinite">Non-finite (Inf., Part., Gerund)</option>
            <option value="imperative">Imperative</option>
          </select>
        </label>
        <label>
          Tense
          <select id="verb-tense-select">
            <option value="all">All Tenses</option>
            <option value="presentActive">Present Active</option>
            <option value="imperfectActive">Imperfect Active</option>
            <option value="futureActive">Future Active</option>
            <option value="perfectActive">Perfect Active</option>
            <option value="pluperfectActive">Pluperfect Active</option>
            <option value="futperfActive">Future Perfect Active</option>
            <option value="presentPassive">Present Passive</option>
            <option value="imperfectPassive">Imperfect Passive</option>
            <option value="futurePassive">Future Passive</option>
            <option value="perfectPassive">Perfect Passive</option>
            <option value="pluperfectPassive">Pluperfect Passive</option>
            <option value="futperfPassive">Future Perfect Passive</option>
          </select>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="verb-endings-toggle">
          Show endings only
        </label>
      </div>
      <div id="verb-display"></div>
    </section>

    <!-- ── NOUNS ── -->
    <section id="nouns" class="section">
      <h2>Noun Declensions</h2>
      <div class="controls">
        <label>
          Declension
          <select id="noun-decl-select">
            <option value="first">1st Declension — puella, puellae (girl)</option>
            <option value="secondM">2nd Declension Masc. — servus, servī (slave)</option>
            <option value="secondN">2nd Declension Neut. — bellum, bellī (war)</option>
            <option value="thirdCons">3rd Declension Consonant — rēx, rēgis (king)</option>
            <option value="thirdIsteM">3rd Declension i-stem M/F — cīvis, cīvis (citizen)</option>
            <option value="thirdIsteN">3rd Declension i-stem Neut. — mare, maris (sea)</option>
            <option value="thirdNeutCons">3rd Declension Neut. Cons. — opus, operis (work)</option>
            <option value="fourthM">4th Declension Masc. — manus, manūs (hand)</option>
            <option value="fourthN">4th Declension Neut. — cornū, cornūs (horn)</option>
            <option value="fifth">5th Declension — rēs, reī (thing)</option>
          </select>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="noun-endings-toggle">
          Show endings only
        </label>
      </div>
      <div id="noun-display"></div>
    </section>

    <!-- ── ADJECTIVES ── -->
    <section id="adjectives" class="section">
      <h2>Adjective Declensions</h2>
      <div class="controls">
        <label>
          Type
          <select id="adj-type-select">
            <option value="212">1st/2nd Declension — bonus, bona, bonum (good)</option>
            <option value="3-3">3rd Decl. 3 endings — ācer, ācris, ācre (keen)</option>
            <option value="3-2">3rd Decl. 2 endings — gravis, grave (serious)</option>
            <option value="3-1">3rd Decl. 1 ending — ingēns, ingentis (huge)</option>
            <option value="comp">Comparative — altior, altius (taller)</option>
            <option value="super">Superlative — altissimus, -a, -um (tallest)</option>
          </select>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="adj-endings-toggle">
          Show endings only
        </label>
      </div>
      <div id="adj-display"></div>
    </section>

    <!-- ── VOCABULARY ── -->
    <section id="vocabulary" class="section">
      <h2>Essential Vocabulary</h2>
      <div class="controls">
        <label>
          Category
          <select id="vocab-cat-select">
            <option value="all">All Categories</option>
            <option value="nouns">Nouns</option>
            <option value="verbs">Verbs</option>
            <option value="adjectives">Adjectives</option>
            <option value="adverbs">Adverbs &amp; Prepositions</option>
            <option value="conjunctions">Conjunctions, Pronouns &amp; Particles</option>
          </select>
        </label>
        <label>
          Search
          <input type="text" id="vocab-search" placeholder="Latin or English…">
        </label>
      </div>
      <div id="vocab-display"></div>
    </section>

    <!-- ── SENTENCES ── -->
    <section id="sentences" class="section">
      <h2>Latin Sentences &amp; Famous Quotes</h2>
      <div class="controls">
        <label>
          Category
          <select id="sent-cat-select">
            <option value="all">All</option>
            <option value="quotes">Famous Quotes</option>
            <option value="grammar">Grammar Examples</option>
            <option value="literature">Literature</option>
          </select>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="sent-hide-toggle">
          Hide translation
        </label>
      </div>
      <div id="sentences-display"></div>
    </section>

    <!-- ── QUIZ ── -->
    <section id="quiz" class="section">
      <h2>Quiz</h2>
      <div class="controls" id="quiz-setup">
        <label>
          Quiz type
          <select id="quiz-type-select">
            <option value="vocab-l2e">Vocabulary: Latin → English</option>
            <option value="vocab-e2l">Vocabulary: English → Latin</option>
            <option value="noun-form">Noun Forms: identify case &amp; number</option>
            <option value="verb-form">Verb Forms: identify tense &amp; person</option>
            <option value="produce-noun">Produce: decline a noun</option>
            <option value="produce-verb">Produce: conjugate a verb</option>
            <option value="sentence">Sentence Translation</option>
            <option value="mixed">Mixed</option>
          </select>
        </label>
        <label>
          Questions
          <select id="quiz-count-select">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="30">30</option>
          </select>
        </label>
        <button id="quiz-start-btn" class="btn-primary">Start Quiz</button>
      </div>

      <div id="quiz-arena" style="display:none;">
        <div id="quiz-progress-bar-wrap"><div id="quiz-progress-bar"></div></div>
        <div id="quiz-score-line"></div>
        <div id="quiz-question-box">
          <p id="quiz-prompt"></p>
          <div id="quiz-choices"></div>
          <div id="quiz-feedback"></div>
        </div>
        <button id="quiz-next-btn" class="btn-primary" style="display:none;">Next</button>
        <button id="quiz-restart-btn" class="btn-secondary" style="display:none;">Restart</button>
      </div>

      <div id="quiz-results" style="display:none;">
        <h3>Results</h3>
        <p id="quiz-final-score"></p>
        <div id="quiz-review-list"></div>
        <button id="quiz-again-btn" class="btn-primary">Play Again</button>
      </div>
    </section>
  </main>

  <footer>
    <p>Classical Latin Study &mdash; covering all five declensions, all verb conjugations, essential vocabulary, and quizzes.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
